name: ci
on:
  push: { branches: [main, develop] }
  pull_request:
  # Manual trigger. This repo recorded ZERO workflow runs across three release tags
  # while the workflow reported `state: active` — pushes and PRs registered
  # check-suites for the deploy integrations but never for Actions, and without
  # workflow_dispatch there was no way to force a run or to tell "never triggered"
  # apart from "triggered and passed silently".
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --all-extras --dev
      - name: lint
        run: uv run ruff check .
      - name: format
        run: uv run ruff format --check .
      - name: types
        run: uv run mypy .
      - name: correctness tests
        run: uv run pytest tests/correctness -q
      - name: adversarial tests
        run: uv run pytest tests/adversarial -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
