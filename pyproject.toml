[project]
name = "onewayglass"
version = "0.0.0"
description = "RAG over company documents leaks: filtering after retrieval changes result counts, so absence is inferable."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raghuram P" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Benchmarks exist to print legible tables for humans. Print statements and long format
# strings are the deliverable, not a lapse.
"bench/**" = ["T201", "E501", "N806"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
  # Docstrings use unicode arrows and en dashes deliberately; ASCII would be less clear.
  "RUF002",
  "RUF003",
]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
# NOTE: in a file named pytest.ini this section must be [pytest]; inside
# pyproject.toml it must be [tool.pytest.ini_options]. Getting this wrong makes
# every setting here silently inert — a real bug observed in a production repo.
# src on the path so tests import the package without an editable install, and "." so
# tests/fixtures/ is importable. Without this every test module fails to collect — hit
# twice before adding it here.
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
